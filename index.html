<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <title>Cali: La Sucursal Natural - Novela Visual</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <link href="https://code.getmdl.io/1.3.0/material.indigo-pink.min.css" rel="stylesheet" />
    <script defer src="https://code.getmdl.io/1.3.0/material.min.js"></script>
    <style>
    :root {
        --accent: #2e7d32;
        --accent-hover: #1b5e20;
        --text-dark: #233d26;
    }
    
    * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    body {
        margin: 0;
        padding: 0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #1b3b2b 0%, #0d1f14 100%);
        height: 100vh;
        width: 100vw;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
    }

    .book-container {
        width: 96vw;
        max-width: 1100px;
        aspect-ratio: 16 / 9;
        max-height: 90vh;
        background: #000;
        border-radius: 12px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.7);
        display: flex;
        flex-direction: column;
        position: relative;
        border: 4px solid #2c1d11;
        overflow: hidden;
    }

    .img-frame {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #000;
        z-index: 1;
    }

    .img-frame img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }

    .page {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        align-items: center; /* Centra todo el contenido horizontalmente */
        padding: 15px;
        box-sizing: border-box;
        z-index: 2;
    }

    .audio-bar {
        position: absolute;
        top: 15px;
        right: 20px;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: rgba(232, 245, 233, 0.85);
        padding: 3px 10px;
        border-radius: 20px;
        border: 1px solid #c8e6c9;
        min-width: 140px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    #story-container {
        width: 100%;
        display: flex;
        justify-content: center;
        z-index: 5;
        margin-bottom: 8px;
    }

    /* Recuadro de texto: al 60% de transparencia y reducido a la mitad de ancho */
    .highlight-text-box {
        background: rgba(255, 255, 255, 0.60) !important; /* 60% de opacidad */
        backdrop-filter: blur(4px); /* Suaviza la imagen de fondo */
        border: 2px solid rgba(46, 125, 50, 0.8);
        border-radius: 10px;
        padding: 10px 18px;
        width: 65%; /* Reducido casi a la mitad */
        max-width: 700px;
        margin: 0 auto;
        box-shadow: 0 6px 15px rgba(0, 0, 0, 0.25);
        text-align: center !important;
    }

    /* TODOS los textos alineados al centro */
    .highlight-text-box p, 
    .highlight-text-box h3, 
    .highlight-text-box span {
        color: var(--text-dark);
        font-size: clamp(0.85rem, 1.8vh, 1.05rem);
        line-height: 1.4;
        font-weight: 600;
        margin: 0;
        text-align: center !important;
    }

    #action-area {
        width: 100%;
        display: flex;
        justify-content: center;
        z-index: 5;
    }

    .btn-group {
        display: flex;
        gap: 8px;
        justify-content: center;
        align-items: center;
        flex-wrap: wrap;
        width: 100%;
        margin-bottom: 4px;
    }

    /* Botones más pequeños y contenidos */
    button {
        background-color: var(--accent);
        color: white;
        border: none;
        padding: 7px 16px; /* Padding más compacto */
        font-size: 0.82rem; /* Texto más pequeño */
        font-weight: 600;
        border-radius: 6px;
        cursor: pointer;
        box-shadow: 0 3px 6px rgba(0,0,0,0.3);
        transition: all 0.2s ease;
        min-height: 36px;
        text-align: center;
    }

    button:hover {
        background-color: var(--accent-hover);
        transform: translateY(-1px);
    }

    /* Botones de trivia compactos */
    .trivia-btn {
        background-color: rgba(69, 90, 100, 0.85);
        text-align: center !important;
        padding: 8px 12px;
        font-size: 0.82rem;
        border-radius: 6px;
        color: white;
        border: none;
        cursor: pointer;
        flex: 1;
        min-width: 140px;
    }

    .nav-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(0, 0, 0, 0.6);
        padding: 3px 12px;
        border-radius: 6px;
        margin-top: 4px;
        width: 100%;
        z-index: 5;
    }

    .footer-center {
        font-size: 0.7rem;
        color: #fff;
        margin: 0 auto;
        text-transform: uppercase;
        letter-spacing: 1px;
        font-weight: bold;
    }

    .footer-right {
        font-size: 0.75rem;
        font-weight: bold;
        color: #81c784;
        position: absolute;
        right: 15px;
    }

    @media (max-width: 768px) {
        .book-container {
            width: 100vw;
            height: 100vh;
            border-radius: 0;
            border: none;
            aspect-ratio: unset;
        }
        .highlight-text-box {
            width: 90%; /* En móviles se ensancha un poco para legibilidad */
        }
    }
</style>
</head>
<body>

    <div class="book-container">
        <!-- CAPA VISUAL (IMAGEN) -->
        <div class="img-frame" id="visual-frame">
            [Cargando Imagen...]
        </div>

        <!-- CAPA INTERACTIVA (TEXTOS Y BOTONES) -->
        <div class="page page-right">
            <div>
                <div class="audio-bar" id="audio-bar-container" style="display: none;">
                    <span id="audio-bar-label" style="font-size: 0.75rem; font-weight: bold; color: #1b5e20;">🎵 Ambiente</span>
                    <button id="btn-audio-toggle" onclick="toggleControlAudio()" style="padding: 3px 10px; font-size: 0.7rem; border-radius: 12px; min-height: auto;">🔊 ON</button>
                </div>
            </div>

            <div id="story-container">
                <div id="story-content" style="width: 100%; display: flex; flex-direction: column;">
                    <!-- Contenido inyectado desde sketch.js -->
                </div>
            </div>

            <div>
                <div id="action-area">
                    <!-- Botones inyectados desde sketch.js -->
                </div>

                <div class="nav-footer">
                    <div class="footer-center" id="section-name"></div>
                    <div class="footer-right" id="page-indicator"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/p5@1.0.0/lib/p5.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/0.7.3/addons/p5.sound.min.js"></script>
    <script src="sketch.js"></script>
</body>
</html>
