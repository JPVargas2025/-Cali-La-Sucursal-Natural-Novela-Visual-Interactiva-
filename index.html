<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cali: La Sucursal Natural - Novela Visual</title>
    <style>
        :root {
            --bg-book: #fdfbf7;
            --leather: #2c1d11;
            --accent: #2e7d32;
            --accent-hover: #1b5e20;
            --text-dark: #333333;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1b3b2b 0%, #0d1f14 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .book-container {
            width: 90vw;
            max-width: 1150px;
            height: 80vh;
            background: var(--bg-book);
            border-radius: 12px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6), inset 0 0 40px rgba(0,0,0,0.1);
            display: flex;
            position: relative;
            border: 8px solid var(--leather);
        }
        .book-container::before {
            content: '';
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 4px;
            background: rgba(0,0,0,0.15);
            z-index: 10;
        }
        .page {
            flex: 1;
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            overflow-y: auto;
            position: relative;
        }
        .page-left {
            border-right: 1px solid #ddd;
            align-items: center;
            text-align: center;
            background: #fffdf9;
        }
        .page-right {
            background: var(--bg-book);
        }
        h1 { color: var(--accent); font-size: 1.6rem; margin-bottom: 5px; }
        h2 { color: var(--accent); font-size: 1.2rem; margin-top: 5px; }
        p { color: var(--text-dark); font-size: 0.95rem; line-height: 1.5; }
        .img-placeholder {
            width: 100%;
            height: 280px;
            background: #e0e0e0;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #666;
            font-weight: bold;
            margin-bottom: 15px;
            border: 2px dashed #ccc;
            overflow: hidden;
            position: relative;
        }
        #book-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 0.9rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
        }
        button:hover { background-color: var(--accent-hover); transform: translateY(-2px); }
        .audio-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #e8f5e9;
            padding: 6px 12px;
            border-radius: 20px;
            margin-bottom: 10px;
            border: 1px solid #c8e6c9;
        }
        .nav-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: #666;
            border-top: 1px solid #ddd;
            padding-top: 10px;
        }
    </style>
</head>
<body>

    <div class="book-container">
        <!-- Canvas / Sketch para animaciones -->
        <canvas id="book-canvas"></canvas>

        <!-- PÁGINA IZQUIERDA -->
        <div class="page page-left">
            <div>
                <img src="img/logo.png" alt="Logo UAO" style="height: 40px; object-fit: contain; margin-bottom: 5px;" onerror="this.style.display='none'">
                <p style="font-size: 0.8rem; color: #555; margin:0;">Universidad Autónoma de Occidente</p>
            </div>
            <div class="img-placeholder" id="visual-frame">
                [Cargando Escena Visual...]
            </div>
            <div>
                <p style="font-size: 0.75rem; color: #777;">Novela Visual Interactiva - Cali, La Sucursal Natural</p>
            </div>
        </div>

        <!-- PÁGINA DERECHA -->
        <div class="page page-right">
            <div>
                <div class="audio-bar">
                    <span style="font-size: 0.8rem; font-weight: bold; color: #1b5e20;">🎵 Control Ambiental</span>
                    <button id="btn-audio-env" onclick="toggleAudioAmbiente()" style="padding: 4px 10px; font-size: 0.75rem;">🔊 Audio Ambiente: OFF</button>
                </div>
                
                <div id="story-content">
                    <!-- Contenido dinámico inyectado desde sketch.js -->
                </div>
            </div>

            <div>
                <div id="action-area">
                    <!-- Botones de acción dinámicos -->
                </div>

                <div class="nav-footer">
                    <span id="page-indicator">Cargando...</span>
                    <span id="chapter-title">Cali: La Sucursal Natural</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Cargar directamente el archivo sketch.js que pide el profesor -->
    <script src="sketch.js"></script>
</body>
</html>
